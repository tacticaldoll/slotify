# Sample workflow for building and deploying a Hugo site to GitHub Pages,
# adapted for a THEME repo: the theme lives at the repo root and the demo
# content is in exampleSite/ (which sets `theme = 'slotify'`). There is no
# submodule — the theme is the repo — so the build points Hugo at exampleSite
# as the source and resolves the theme via --themesDir (../.. relative to the
# source: 'slotify' is expected at <themesDir>/slotify, i.e. the repo root).
# Mirrors the verified local command: `hugo --source exampleSite --themesDir ../..`.
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting main and release branches
  push:
    branches: ["main", "release/*"]

  # Runs on pull requests targeting main and release branches
  pull_request:
    branches: ["main", "release/*"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      # Pinned to the version the build was verified against; bump deliberately.
      HUGO_VERSION: 0.157.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Install Dart Sass
        run: sudo snap install dart-sass
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # fetch-depth: 0 so Hugo's .GitInfo / .Lastmod have full history.
          fetch-depth: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        # --source exampleSite: build the demo, not the (content-less) theme root.
        # --themesDir ../..: resolve `theme = 'slotify'` to the repo root.
        # --baseURL: the project-pages subpath (e.g. https://<user>.github.io/slotify/),
        # which the SPA reads back via window.__SLOTIFY_BASE__ for base-aware routing.
        run: |
          hugo \
            --source exampleSite \
            --themesDir ../.. \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        # --source exampleSite writes output to exampleSite/public.
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./exampleSite/public

  # Quality gate: governance audit + JSON validation + browser smoke tests.
  # Mirrors the local pre-commit hook (.agent/scripts/pre-commit) and the README's
  # `npm test`, so CI enforces what otherwise relied on a developer remembering to
  # run them. Deployment is gated on this job (see deploy.needs). Runs in parallel
  # with build; a failure here blocks the deploy.
  test:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.157.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # Runs all 10 checks the local pre-commit hook runs (vendor integrity,
      # lifecycle ordering, LF, indent, palette/i18n/slots/ctx/site-config SSOT),
      # so CI and local enforcement never drift.
      - name: Architecture audit (mirrors .agent/scripts/pre-commit)
        run: sh .agent/scripts/pre-commit
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      # The JSON validators read exampleSite/public, so build it first. Playwright
      # boots its own `hugo server` (see playwright.config.js), so no server here.
      - name: Build exampleSite for JSON validation
        run: hugo --source exampleSite --themesDir ../..
      - name: Validate generated JSON (parse + required shape)
        run: |
          python3 exampleSite/validate.py
          python3 exampleSite/deep_validate.py
      - name: Browser smoke tests (Playwright)
        run: npm test

  # Deployment job
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
